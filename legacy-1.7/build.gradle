// Minecraft 1.7.10, through RetroFuturaGradle.
//
// RFG is the living replacement for ForgeGradle 1.2, which is of its era and does not run on a
// modern Gradle. Version 1.4.9 rather than the latest: 2.0.x is compiled for Java 25 and fails
// with "Unsupported class file major version 69" under the JDK 17 that runs this build.
plugins {
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

group = 'fr.julien.actuallyplayed'
version = "${minecraftVersion}-${modVersion}"

java {
    // 1.7.10 predates the module system by a decade; its bytecode level is 8, which is also
    // what `core` has always targeted.
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

// Gradle would otherwise compile with the platform default encoding, which on this machine is
// windows-1252. The 1.12 build was bitten by exactly that, and the mojibake only showed up in
// game. See CLAUDE.md section 7.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mcVersion = minecraftVersion
    // The offline UUID is derived from the username, so without pinning it every run would
    // create a different account and the previous run's data would vanish from the stats
    // screen. Same trap as the 1.12 build - see CLAUDE.md section 7.
    username = 'PlaytimeDev'
}

// `core` is shared as SOURCE, not as an artifact, for the same reason it is in `modern/`: the
// three builds cannot depend on each other, and `core` has one compile-only dependency that
// every Minecraft version ships. There is still exactly one copy in the repository.
sourceSets.main.java.srcDir rootProject.file('../core/src/main/java')

repositories {
    mavenCentral()
}

dependencies {
    // Gson sits on Minecraft's classpath on every version, 1.7.10 included.
    compileOnly 'com.google.code.gson:gson:2.2.4'
}

// Reference is generated rather than checked in with placeholders. ForgeGradle 2.3 has a
// `replace` directive for that; RetroFuturaGradle does not expose one, and generating the file
// depends on no plugin feature at all.
def generatedSources = layout.buildDirectory.dir('generated/sources/reference/java')

def generateReference = tasks.register('generateReference') {
    description = 'Writes Reference.java with the identity from gradle.properties.'
    inputs.property('modId', modId)
    inputs.property('modName', modName)
    inputs.property('version', version)
    outputs.dir generatedSources

    doLast {
        def target = new File(generatedSources.get().asFile,
                'fr/julien/actuallyplayed/legacy/Reference.java')
        target.parentFile.mkdirs()
        target.setText("""package fr.julien.actuallyplayed.legacy;

/** Identity of the mod. Generated by the build from gradle.properties -- do not edit. */
public final class Reference {

    public static final String MOD_ID = "${modId}";
    public static final String MOD_NAME = "${modName}";
    public static final String VERSION = "${version}";

    private Reference() {
    }
}
""", 'UTF-8')
    }
}

sourceSets.main.java.srcDir generateReference.map { generatedSources }

processResources {
    def expandProps = [
            'version'         : version,
            'modId'           : modId,
            'modName'         : modName,
            'minecraftVersion': minecraftVersion
    ]
    filesMatching('mcmod.info') {
        expand expandProps
    }
    inputs.properties(expandProps)
}

// The 1.13+ JSON translations are irrelevant here: 1.7.10 reads the same `.lang` format 1.12
// does, so the files are taken from the 1.12 module unchanged. Copied with `into` rather than
// added as a source directory, which would flatten `assets/` away.
// Minecraft renamed its locale files at 1.11: `en_US.lang` before, `en_us.lang` after. A file
// under the wrong name is not rejected, it is simply never read - which showed in game as every
// key rendering as its own name. The 1.12 sources are the reference; they are renamed on the
// way in rather than duplicated.
processResources {
    from(rootProject.file('../forge-1.12/src/main/resources/assets')) {
        into 'assets'
        rename { String name ->
            def match = name =~ /^([a-z]{2,3})_([a-z0-9]{2,4})\.lang$/
            match ? "${match[0][1]}_${match[0][2].toUpperCase()}.lang" : name
        }
    }
}
