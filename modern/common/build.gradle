// The adapter, compiled against vanilla Minecraft alone.
//
// Nothing here may reference a mod loader. That is the whole point of the module: it is the
// 90% of the port that is the same on Forge, NeoForge and Fabric, and the guard at the bottom
// of this file makes the rule fail the build rather than rely on vigilance -- the same
// approach as `checkNoMinecraftImports` on `core`, one level up.

plugins {
    id 'multiloader-common'
}

// A deobfuscated Minecraft to compile against, and no loader at all. Which plugin provides
// that depends on the version, and the choice is declared in versions/<version>.properties
// rather than inferred here. Applied with `apply plugin:` because a `plugins` block cannot be
// conditional.
if (build_toolchain == 'architectury') {
    // 1.16.5: ModDevGradle's runtime refuses anything older than 1.17. Architectury Loom
    // handles it with official Mojang mappings on modern Gradle. See PORTING.md section 3.9.
    apply plugin: 'dev.architectury.loom'
    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.officialMojangMappings()
        // The loader is declared even though nothing here may reference it: Loom needs a
        // platform to remap against, and `checkNoLoaderImports` still guards the source.
        forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    }
} else if (loader_module == 'neoforge') {
    apply plugin: 'net.neoforged.moddev'
    neoForge {
        neoFormVersion = neoform_version
        parchment {
            minecraftVersion = parchment_minecraft
            mappingsVersion = parchment_version
        }
    }
} else {
    apply plugin: 'net.neoforged.moddev.legacyforge'
    legacyForge {
        mcpVersion = minecraft_version
        parchment {
            minecraftVersion = parchment_minecraft
            mappingsVersion = parchment_version
        }
    }
}

// The handful of calls that differ between Minecraft versions, one directory per version.
// Everything else in this module compiles unchanged against every target -- verified by
// compiling the whole adapter against 1.21.1, which turned up exactly one such call.
sourceSets.main.java.srcDir "src/${version_source_set}/java"

// `core` is shared as SOURCE, not as an artifact.
//
// The two Gradle builds cannot depend on each other -- the root one runs Gradle 4.10.3 on
// JDK 8 for ForgeGradle 2.3, this one needs Gradle 8 on JDK 17. Pointing at the source
// directory keeps exactly one copy of it in the repository and simply compiles it twice.
// `core` has one compile-only dependency, Gson, which every Minecraft version ships.
def coreJava = rootProject.file('../core/src/main/java')

sourceSets.main.java.srcDir coreJava

dependencies {
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
}

// --- translations ------------------------------------------------------------------------
//
// Minecraft wants JSON from 1.13 onward, and the `.lang` files remain the single source of
// truth (PORTING.md section 4.3). The root build has the same task for its own purposes;
// duplicating forty lines is the price of two builds that cannot share code, and the
// conversion is small enough that the duplication is honest.

def langSources = rootProject.file('../forge-1.12/src/main/resources/assets/actuallyplayed/lang')
def langOutput = layout.buildDirectory.dir('generated/lang').get().asFile

task generateLangJson {
    description = 'Generates 1.13+ JSON translations from the .lang sources.'
    group = 'build'

    inputs.files fileTree(dir: langSources, include: '*.lang')
    outputs.dir langOutput

    doLast {
        def backslash = '\\'
        def quote = '"'
        def escape = { String value ->
            // Backslash first: escaping it afterwards would double the ones the quotes added.
            def escaped = value
                    .replace(backslash, backslash + backslash)
                    .replace(quote, backslash + quote)
                    .replace('\n', backslash + 'n')
                    .replace('\r', backslash + 'r')
                    .replace('\t', backslash + 't')
            escaped.each { String character ->
                int code = character.charAt(0) as int
                if (code < 0x20) {
                    throw new GradleException('A translation holds a control character (U+' +
                            String.format('%04X', code) + ') that JSON cannot represent: ' + value)
                }
            }
            return escaped
        }

        def target = new File(langOutput, "assets/${mod_id}/lang")
        target.deleteDir()
        target.mkdirs()

        fileTree(dir: langSources, include: '*.lang').sort { it.name }.each { File source ->
            def entries = [:]
            source.getText('UTF-8').readLines().each { line ->
                def trimmed = line.trim()
                if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                    return
                }
                def separator = line.indexOf('=')
                if (separator < 0) {
                    return
                }
                // The key is trimmed, the value is not: a translation may legitimately end on
                // a space, and the 1.12 parser keeps it.
                entries[line.substring(0, separator).trim()] = line.substring(separator + 1)
            }

            def body = entries.collect { key, value ->
                "  \"${escape(key)}\": \"${escape(value)}\""
            }.join(',' + '\n')

            new File(target, source.name.replace('.lang', '.json'))
                    .setText('{' + '\n' + body + '\n' + '}' + '\n', 'UTF-8')
        }

        logger.lifecycle("Translations: generated ${target.listFiles().length} JSON locales.")
    }
}

// The icon lives beside the lang files, in the 1.12 module, for the same reason: one copy in
// the repository rather than one per build. It is generated from the pixel grid in
// tools/make-icon.py.
def iconSource = rootProject.file('../forge-1.12/src/main/resources/assets/actuallyplayed/icon.png')
def iconOutput = layout.buildDirectory.dir('generated/icon').get().asFile

task copyIcon(type: Copy) {
    from iconSource
    into new File(iconOutput, "assets/${mod_id}")
}

// --- what the loader modules consume -------------------------------------------------------
//
// Source directories, not a jar. Unlike the upstream template this module has more than one of
// each, so they cannot be published with `singleFile`.

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    sourceSets.main.java.srcDirs.each { commonJava it }
    sourceSets.main.resources.srcDirs.each { commonResources it }
    commonResources(langOutput) {
        builtBy generateLangJson
    }
    commonResources(iconOutput) {
        builtBy copyIcon
    }
}

// --- guard rail ------------------------------------------------------------------------------

task checkNoLoaderImports {
    description = 'Fails the build if common references a mod loader.'
    group = 'verification'

    def sources = fileTree(dir: 'src', include: '**/*.java')
    inputs.files sources

    doLast {
        // NeoForge and Forge share the `net.minecraftforge` prefix on 1.20.1, so both are
        // covered by the first alternative.
        def forbidden = ~/^\s*import\s+(net\.minecraftforge|net\.neoforged|net\.fabricmc)\./
        def offenders = []

        sources.each { file ->
            file.readLines().eachWithIndex { line, index ->
                if (forbidden.matcher(line).find()) {
                    offenders << "  ${file.name}:${index + 1}  ${line.trim()}"
                }
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                    'The `common` module must never reference a mod loader.' +
                    System.lineSeparator() +
                    'Move this code into forge/ or fabric/, or express it through an interface ' +
                    'that each loader implements:' +
                    System.lineSeparator() +
                    offenders.join(System.lineSeparator()))
        }
    }
}

check.dependsOn checkNoLoaderImports
