// Loom comes in two flavours and only one may be on the classpath: Architectury Loom is a fork
// of Fabric Loom and ships the same plugin class, so declaring both fails with
// "'net.fabricmc.loom.LoomGradlePlugin' is neither a plugin or a rule source".
//
// Which one is right depends on the Minecraft version -- ModDevGradle cannot go below 1.17, so
// 1.16.5 uses Architectury Loom (the build tool; Architectury API stays ruled out, see
// PORTING.md section 3.3). A `plugins` block cannot be conditional, but a `buildscript` one can.
buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    dependencies {
        if (gradle.versionProperties.getProperty('build_toolchain') == 'architectury') {
            classpath 'dev.architectury:architectury-loom:1.10.455'
        } else {
            classpath 'net.fabricmc:fabric-loom:1.9.2'
            classpath 'net.neoforged:moddev-gradle:2.0.144'
        }
    }
}

// The selected version's values, read once in settings.gradle, exposed to every project under
// the names the module scripts use.
allprojects {
    gradle.versionProperties.each { key, value ->
        ext.set(key.toString(), value.toString())
    }
    ext.set('mcVersion', gradle.mcVersion)

    // "1.20.1-1.1.0", not "1.1.0". Forge compares reported versions with Maven's
    // ComparableVersion, so a bare "1.1.0" sorts BELOW any "1.12.2-x" and the update checker
    // would report "up to date" forever. See CLAUDE.md section 12.
    version = "${gradle.mcVersion}-${mod_version}"
}
