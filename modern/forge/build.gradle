plugins {
    id 'multiloader-loader'
}

apply plugin: build_toolchain == 'architectury' ? 'dev.architectury.loom' : 'net.neoforged.moddev.legacyforge'

if (build_toolchain == 'architectury') {
    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.officialMojangMappings()
        forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    }
} else {
legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
            // The offline UUID is derived from the username, so without pinning it every run
            // would create a different account and the previous run's data would vanish from
            // the stats screen. Same trap as the 1.12 build -- see CLAUDE.md section 7.
            programArguments.addAll '--username', 'PlaytimeDev'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

jar {
    finalizedBy('reobfJar')
}
}
