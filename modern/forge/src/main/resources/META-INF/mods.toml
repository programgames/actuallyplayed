modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
logoFile="assets/actuallyplayed/icon.png"
authors="${mod_author}"
description='''${description}'''

# The mod is client-only: it stores nothing on the server and sends no packet, so joining a
# server that does not have it must never be blocked. This is the 1.20 spelling of what 1.12
# expressed as acceptableRemoteVersions="*".
displayTest="IGNORE_ALL_VERSION"
# Drives Forge/NeoForge's "update available" marker. The versions inside must be the
# exact strings this mod reports, prefix included -- see CLAUDE.md section 12.
updateJSONURL="https://raw.githubusercontent.com/programgames/actuallyplayed/main/update.json"


[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_loader_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
