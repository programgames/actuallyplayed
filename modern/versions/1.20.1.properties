# Minecraft 1.20.1 -- the reference Forge modpack version.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
java_version=17

# Java toolchain only: Gradle itself may run on any JDK for this version.
gradle_java_version=17

# The source directory holding this version's platform code (PORTING.md section 3.7).
version_source_set=mc1_20

parchment_minecraft=1.20.1
parchment_version=2023.09.03

fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# Forge, not NeoForge: NeoForge does not exist below 1.20.2.
loader_module=forge
forge_version=47.2.30
forge_loader_version_range=[47,)
