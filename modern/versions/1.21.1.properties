# Minecraft 1.21.1 -- the current modpack base.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
java_version=21

# Gradle ITSELF must run on JDK 21 here, not merely target it: Loom refuses with
# "Minecraft 1.21.1 requires Java 21 but Gradle is using 17" because the Minecraft setup runs
# inside the Gradle process. See PORTING.md section 3.6.
gradle_java_version=21

version_source_set=mc1_21

parchment_minecraft=1.21.1
parchment_version=2024.11.17

fabric_version=0.116.15+1.21.1
fabric_loader_version=0.16.14

# NeoForge, which replaced Forge on modern versions.
loader_module=neoforge
neoforge_version=21.1.249
neoform_version=1.21.1-20240808.144430
