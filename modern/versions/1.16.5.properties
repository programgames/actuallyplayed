# Minecraft 1.16.5 -- the last "classic" Forge version, still carrying active modpacks.
#
# Built with Architectury Loom rather than ModDevGradle, whose runtime refuses anything older
# than 1.17: "NFRT currently does not support MCP versions that did not make use of official
# Mojang mappings (pre 1.17)". Mojang published mappings from 1.14.4, but Minecraft's own build
# only adopted them at 1.17 and NeoForm follows the latter. See PORTING.md section 3.9.
#
# Architectury LOOM is the build tool; Architectury API, the runtime library players would have
# to install, stays ruled out (section 3.3). Using one does not pull in the other.
minecraft_version=1.16.5
minecraft_version_range=[1.16.5,1.17)
java_version=8
gradle_java_version=17

version_source_set=mc1_16
build_toolchain=architectury

parchment_minecraft=1.16.5
parchment_version=2022.03.06

# Fabric API was published under the mod id `fabric` before roughly 1.19, and as
# `fabric-api` after. Declaring the wrong one fails at launch with "requires any version
# of fabric-api, which is missing" even though the jar is on the classpath.
fabric_api_id=fabric
fabric_version=0.42.0+1.16
fabric_loader_version=0.16.14

loader_module=forge
forge_version=36.2.39
forge_loader_version_range=[36,)
