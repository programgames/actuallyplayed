# Values that do not depend on the Minecraft version.
# Everything that does lives in versions/<version>.properties -- see settings.gradle.

# The mod version alone. The version a jar reports is "<minecraft>-<mod>", assembled in
# build.gradle -- see CLAUDE.md section 12. Keep it in step with modVersion in the root
# gradle.properties: one number describes the mod, whatever Minecraft version it is built for.
mod_version=1.1.0
group=fr.julien.actuallyplayed

mod_name=Actually Played
mod_author=Julien Marcon
mod_id=actuallyplayed
license=MIT
credits=
description=Tracks how much time you actually played on each server and world, and how much of it you were just AFK. Client-side only, works on any server, no dependencies. Read it in the vanilla Statistics screen. Forge, NeoForge, Fabric.

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
