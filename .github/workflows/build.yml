name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Two builds, deliberately separate and run in parallel. They cannot be one job: the 1.12
  # build enforces JDK 8 and Gradle 4.10.3 for ForgeGradle 2.3, while the modern build needs
  # Gradle 8 and JDK 17. See PORTING.md section 3.5.

  legacy-1-12:
    name: Minecraft 1.12.2 (Forge)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # ForgeGradle 2.3 and Gradle 4.10.3 do not run on any JDK newer than 8.
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      # Decompiling Minecraft takes 10-20 minutes. Caching it turns every run after the
      # first into a couple of minutes.
      - name: Cache Gradle and ForgeGradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/minecraft
          key: ${{ runner.os }}-forge-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-forge-


      # Runs first and needs no Minecraft at all: if the engine is broken, say so in
      # seconds rather than after a full decompile.
      - name: Test the engine
        run: ./gradlew :core:check --no-daemon --stacktrace

      # Same reasoning: reads text files, needs no Minecraft. A translation that drifted
      # from en_us.lang fails here in seconds instead of shipping half in English.
      - name: Check the translations
        run: ./gradlew checkLangParity --no-daemon --stacktrace

      - name: Set up the Forge workspace
        run: ./gradlew setupCiWorkspace --no-daemon

      - name: Build the mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: actuallyplayed
          path: forge-1.12/build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: core/build/reports/tests/

  modern:
    name: Minecraft ${{ matrix.mc }} (${{ matrix.loaders }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern

    strategy:
      # One version failing should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - mc: '1.16.5'
            loaders: 'Forge and Fabric'
            # Built with Architectury Loom, and targeting Java 8. Gradle itself may run on 17.
            jdk: '17'
          - mc: '1.20.1'
            loaders: 'Forge and Fabric'
            # Gradle itself may run on any JDK for this version; the toolchain handles the
            # compile target.
            jdk: '17'
          - mc: '1.21.1'
            loaders: 'NeoForge and Fabric'
            # Loom refuses to set up Minecraft 1.21.1 unless Gradle itself runs on JDK 21 --
            # a toolchain declaration is not enough. See PORTING.md section 3.6.
            jdk: '21'

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      # Its own cache key: this build shares no dependency with the 1.12 one, and mixing them
      # would evict one on every change to the other.
      - name: Cache Gradle and the Minecraft artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.neoformruntime
          key: ${{ runner.os }}-modern-${{ matrix.mc }}-${{ hashFiles('modern/**/*.gradle', 'modern/gradle.properties', 'modern/versions/*.properties', 'modern/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-modern-${{ matrix.mc }}-

      # Fails in seconds if a loader import found its way into the shared module, rather than
      # after Minecraft has been decompiled.
      - name: Check that common stays loader-neutral
        run: ./gradlew -Pmc=${{ matrix.mc }} :common:checkNoLoaderImports --no-daemon --stacktrace

      - name: Build both loaders
        run: ./gradlew -Pmc=${{ matrix.mc }} build --no-daemon --stacktrace

      - name: Upload the jars
        uses: actions/upload-artifact@v7
        with:
          name: actuallyplayed-${{ matrix.mc }}
          path: |
            modern/forge/build/libs/*.jar
            modern/neoforge/build/libs/*.jar
            modern/fabric/build/libs/*.jar
          if-no-files-found: error

  legacy-1-7:
    name: Minecraft 1.7.10 (Forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-1.7

    steps:
      - uses: actions/checkout@v7

      # RetroFuturaGradle targets Java 8 but runs on a modern JDK, unlike the 1.12 build where
      # ForgeGradle 2.3 forces Gradle itself onto 8.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and the Minecraft artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-legacy17-${{ hashFiles('legacy-1.7/**/*.gradle', 'legacy-1.7/gradle.properties') }}
          restore-keys: ${{ runner.os }}-legacy17-

      - name: Build the mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: actuallyplayed-1.7.10
          path: legacy-1.7/build/libs/actuallyplayed-*[0-9].jar
          if-no-files-found: error
